# Minimal XcodeGen spec (iOS app + unit + UI test targets). Fallback ONLY when no *.xcodeproj,
# *.xcworkspace, Package.swift or project.yml exists at {root} (SKILL.md → step 2).
#
# Index: usage (below) · options/settings · targets (app, Tests, UITests) · schemes
#
# Usage: save as {root}/project.yml, fill placeholders, run `xcodegen generate`.
#   XcodeGen is MIT; `brew install xcodegen` needs user approval. Never overwrite an existing project.yml.
#   {project_name} e.g. RecipeBlog · {bundle_prefix} e.g. com.example · {ios_version} e.g. "17.0"
#   Sources: {project_name}/Sources (globbed, incl. Localizable.xcstrings and .json resources).
#   Also add {root}/.swiftlint.yml (include app + test folders, exclude build).

name: {project_name}
options:
  bundleIdPrefix: {bundle_prefix}
  developmentLanguage: en                    # String Catalog source language (see Localization guardrail)
  deploymentTarget:
    iOS: "{ios_version}"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES     # "no compiler warnings tolerated" (Testing & CI guardrail)
targets:
  {project_name}:
    type: application
    platform: iOS
    sources: [{project_name}/Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: {project_name}   # optional: user-facing app name
  {project_name}Tests:                       # Swift Testing / XCTest unit tests
    type: bundle.unit-test
    platform: iOS
    sources: [{project_name}Tests]
    dependencies: [{target: {project_name}}]
    settings:
      base: {GENERATE_INFOPLIST_FILE: YES}
  {project_name}UITests:                     # XCUITest
    type: bundle.ui-testing
    platform: iOS
    sources: [{project_name}UITests]
    dependencies: [{target: {project_name}}]
    settings:
      base: {GENERATE_INFOPLIST_FILE: YES}
schemes:
  {project_name}:
    build: {targets: {{project_name}: all}}
    test: {targets: [{project_name}Tests, {project_name}UITests]}
