<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDD progress</title>
<!--
  SDD progress view — generated by scripts/sdd_progress.js, which replaces the data placeholder below with the view data.
  Self-contained: no network, works from file://. Do not edit a generated progress.html; edit this template.
-->
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--panel-2:#efede7;--line:#dcd8cf;--ink:#1e1c18;--ink-2:#615c52;
  --accent:#0d7a72;--accent-ink:#ffffff;--accent-tint:#dcefed;
  --ok:#2d8a4e;--ok-tint:#e1f1e6;--auto:#6a4bc4;--auto-tint:#ece6fa;--wait:#a8650f;--wait-tint:#fbefd9;
  --run:#2a62c4;--run-tint:#e2ebfa;--off:#9a958a;--off-tint:#efede7;--bad:#c23b32;--bad-tint:#fbe5e2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --r:12px;--r-sm:8px;--lift:0 1px 0 rgba(30,28,24,.04),0 6px 18px -10px rgba(30,28,24,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412;--panel:#1c1c19;--panel-2:#252521;--line:#36352f;--ink:#ece9e1;--ink-2:#a39e92;
  --accent:#3cbcb0;--accent-ink:#0f1d1b;--accent-tint:#173a37;
  --ok:#5cc47e;--ok-tint:#1b3324;--auto:#a58cf2;--auto-tint:#2a2342;--wait:#e2a54a;--wait-tint:#3a2c14;
  --run:#73a2f2;--run-tint:#1b2a45;--off:#77736a;--off-tint:#252521;--bad:#f07a70;--bad-tint:#3d1d1a;
  --lift:none;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141412;--panel:#1c1c19;--panel-2:#252521;--line:#36352f;--ink:#ece9e1;--ink-2:#a39e92;
  --accent:#3cbcb0;--accent-ink:#0f1d1b;--accent-tint:#173a37;
  --ok:#5cc47e;--ok-tint:#1b3324;--auto:#a58cf2;--auto-tint:#2a2342;--wait:#e2a54a;--wait-tint:#3a2c14;
  --run:#73a2f2;--run-tint:#1b2a45;--off:#77736a;--off-tint:#252521;--bad:#f07a70;--bad-tint:#3d1d1a;
  --lift:none;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans)}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--ink-2)}.sm{font-size:12.5px;line-height:1.45}
.t-ok{color:var(--ok)}.t-auto{color:var(--auto)}.t-wait{color:var(--wait)}.t-run{color:var(--run)}.t-off{color:var(--off)}.t-bad{color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:28px 0 18px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:750 30px/1.15 var(--sans);letter-spacing:-.02em;margin:8px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ring{display:grid;place-items:center;position:relative;width:92px;height:92px}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .val{position:absolute;text-align:center;line-height:1.1}
.ring .val b{display:block;font:700 20px/1 var(--mono)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.ring{display:none}}

/* chips and gate keys */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;background:var(--panel-2);color:var(--ink-2);font:500 12px/20px var(--sans);white-space:nowrap}
.chip.c-ok{background:var(--ok-tint);color:var(--ok)}.chip.c-auto{background:var(--auto-tint);color:var(--auto)}
.chip.c-wait{background:var(--wait-tint);color:var(--wait)}.chip.c-run{background:var(--run-tint);color:var(--run)}
.chip.c-bad{background:var(--bad-tint);color:var(--bad)}.chip.c-accent{background:var(--accent-tint);color:var(--accent)}
kbd.gate{display:inline-block;font:600 11px/17px var(--mono);padding:0 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--ink);white-space:nowrap}

/* segmented tabs */
.seg{display:flex;gap:4px;padding:4px;background:var(--panel-2);border-radius:var(--r);overflow-x:auto;margin-bottom:22px}
.seg button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;font:550 13.5px/20px var(--sans);color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--lift)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.seg .n{font:600 11px/16px var(--mono);padding:0 6px;border-radius:5px;background:var(--bg)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;padding-bottom:40px}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);margin-bottom:18px}
.card-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:14px 18px 10px}
.card-head h2{font:700 15px/1.3 var(--sans);margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 auto}
.ghost{all:unset;cursor:pointer;font:550 12.5px/20px var(--sans);color:var(--accent);padding:2px 8px;border-radius:6px}
.ghost:hover{background:var(--accent-tint)}
.ghost:focus-visible{outline:2px solid var(--accent)}

/* now panel */
.now{display:grid;grid-template-columns:44px 1fr;overflow:hidden}
.now .gutter{display:grid;place-items:start center;padding-top:18px;background:var(--accent-tint);color:var(--accent)}
.now.waiting .gutter{background:var(--wait-tint);color:var(--wait)}
.now .gutter svg.i{width:20px;height:20px}
.now .body{padding:14px 18px 16px;display:grid;gap:8px}
.now h2{margin:0;font:700 15px/1.3 var(--sans)}
.now p{margin:0}
.ask{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border:1px dashed var(--wait);border-radius:var(--r-sm);background:var(--wait-tint)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font:600 13px/18px var(--sans);cursor:pointer}
.btn:hover{filter:brightness(1.07)}

/* pipeline */
.pipe{list-style:none;margin:0;padding:4px 0 10px}
.stop{position:relative;padding:0 18px 0 58px}
.stop::before{content:"";position:absolute;left:33px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child::before{top:22px}.stop:last-child::before{bottom:calc(100% - 22px)}
.stop.flow::before{background:var(--ok)}
.node{position:absolute;left:21px;top:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid currentColor;z-index:1}
.node svg.i{width:14px;height:14px;stroke-width:2.5}
.s-approved .node,.s-done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.s-auto .node{background:var(--auto);border-color:var(--auto);color:#fff}
.s-review .node{background:var(--wait-tint);border-color:var(--wait);color:var(--wait)}
.s-active .node{background:var(--run-tint);border-color:var(--run);color:var(--run);box-shadow:0 0 0 4px var(--run-tint)}
.s-todo .node,.s-skipped .node{color:var(--off)}.s-skipped .node{border-style:dashed}
.s-blocked .node,.s-reverted .node{background:var(--bad);border-color:var(--bad);color:#fff}
.stop-head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;min-height:44px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.stop-head:hover{background:var(--panel-2)}
.stop-head:focus-visible{outline:2px solid var(--accent)}
.stop.is-now .stop-head{background:var(--run-tint)}
.stop.is-now.s-review .stop-head{background:var(--wait-tint)}
.stop-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.stop-title .num{font:600 11.5px/1 var(--mono);color:var(--ink-2)}
.stop-title .name{font-weight:650}
.stop-title .sub{color:var(--ink-2)}
.here{font:700 10px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:0 6px;border-radius:4px}
.stop-state{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.caret{transition:transform .15s;color:var(--ink-2)}
.stop-head[aria-expanded="true"] .caret{transform:rotate(180deg)}
.stop-body{padding:4px 10px 16px;display:grid;gap:12px}
.stop-body p{margin:0}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 14px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--ink-2)}dl.kv dd{margin:0}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);font:500 12px/20px var(--mono);text-decoration:none}
.file:hover{border-color:var(--accent)}
.meter{display:grid;gap:6px}
.bar{display:flex;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar span{background:var(--ok)}
.wi{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:560px){.stop{padding-left:48px;padding-right:10px}.stop::before{left:23px}.node{left:11px}.stop-head{grid-template-columns:1fr}dl.kv{grid-template-columns:1fr}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;vertical-align:top;border-top:1px solid var(--line)}
thead th{border-top:0;background:var(--panel-2);font:600 11px/16px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
td.cur,th.cur{background:var(--accent-tint)}

/* task cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:4px 18px 18px}
.tcard{all:unset;box-sizing:border-box;display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);cursor:pointer}
.tcard:hover{border-color:var(--accent)}
.tcard:focus-visible{outline:2px solid var(--accent)}
.tcard.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard.idle{cursor:default;border-style:dashed;background:transparent}
.tcard.idle:hover{border-color:var(--line)}
.tcard .tt{font-weight:650}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:6px;border-radius:2px;background:var(--off-tint);border:1px solid var(--line)}
.segbar i.s-approved,.segbar i.s-done{background:var(--ok);border-color:var(--ok)}.segbar i.s-auto{background:var(--auto);border-color:var(--auto)}
.segbar i.s-review{background:var(--wait);border-color:var(--wait)}.segbar i.s-active{background:var(--run);border-color:var(--run)}
.segbar i.s-blocked,.segbar i.s-reverted{background:var(--bad);border-color:var(--bad)}.segbar i.s-skipped{background:transparent;border-style:dashed}

/* decision log */
.log{padding:0 18px 14px}
.day{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:14px 0 8px;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:58px 4px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .clock{font:500 12px/20px var(--mono);color:var(--ink-2)}
.entry .stripe{border-radius:2px;background:var(--off)}
.entry .stripe.s-approved{background:var(--ok)}.entry .stripe.s-auto{background:var(--auto)}.entry .stripe.s-review{background:var(--wait)}.entry .stripe.s-reverted{background:var(--bad)}
.entry .what{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry .ctx{margin-top:2px}

/* side panels */
.side .card{padding:14px 16px}
.side h3{margin:0 0 10px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.side li{display:flex;gap:7px;align-items:flex-start;min-width:0}
.side li a{overflow-wrap:anywhere}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
footer{padding:18px 0 32px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow" id="eyebrow">SDD workflow</div>
      <h1 id="title">SDD progress</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="ring" id="ring" aria-hidden="true"></div>
  </header>
  <nav class="seg" role="tablist" aria-label="Sections" id="tabs"></nav>
  <div class="grid">
    <main>
      <section data-tab="overview" role="tabpanel">
        <div class="card now" id="now"></div>
        <div class="card" id="app-card" hidden></div>
        <div class="card" id="task-card"></div>
      </section>
      <section data-tab="tasks" role="tabpanel" hidden><div class="card" id="tasks-card"></div></section>
      <section data-tab="log" role="tabpanel" hidden><div class="card" id="log-card"></div></section>
      <section data-tab="ops" role="tabpanel" hidden><div class="card" id="ops-card"></div></section>
      <section data-tab="rules" role="tabpanel" hidden><div class="card" id="rules-card"></div></section>
    </main>
    <aside class="side" id="side" aria-label="Summary"></aside>
  </div>
  <footer class="dim sm" id="footer"></footer>
</div>

<script type="application/json" id="sdd-progress-data">__SDD_PROGRESS_DATA__</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('sdd-progress-data').textContent);

  // Stroke icons, 24-unit grid.
  var P = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    bot: '<rect x="4.5" y="8" width="15" height="11" rx="3.5"/><path d="M12 8V4.5M9.5 13h.01M14.5 13h.01M9.5 16.2h5"/>',
    wait: '<path d="M7 3.5h10M7 20.5h10M8 3.5c0 4.5 8 4.5 8 8.5s-8 4-8 8.5M16 3.5c0 4.5-8 4.5-8 8.5s8 4 8 8.5"/>',
    run: '<circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>',
    todo: '<circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>',
    skip: '<path d="M5 12h11M12 7l5 5-5 5M19.5 6v12"/>',
    x: '<path d="M7 7l10 10M17 7L7 17"/>',
    undo: '<path d="M9 14L4.5 9.5 9 5"/><path d="M4.5 9.5H14a5.5 5.5 0 010 11h-3"/>',
    caret: '<path d="M6 9.5l6 6 6-6"/>',
    file: '<path d="M14 3.5H7a2 2 0 00-2 2v13a2 2 0 002 2h10a2 2 0 002-2v-10z"/><path d="M14 3.5v5h5"/>',
    term: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l3 2.5L7 15M12.5 15h4.5"/>',
    copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7.5a2 2 0 002 2h2.5"/>',
    compass: '<circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    flag: '<path d="M5.5 21V4.5M5.5 4.5h11l-2 4 2 4h-11"/>',
    stack: '<path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>',
    pen: '<path d="M4 20l4.2-1 10.3-10.3a2.1 2.1 0 00-3-3L5.2 16z"/><path d="M13.5 7.2l3.3 3.3"/>',
    shield: '<path d="M12 3.5l7.5 3v5.5c0 4.6-3.2 7.7-7.5 9-4.3-1.3-7.5-4.4-7.5-9V6.5z"/><path d="M9 12l2.2 2.2L15.5 10"/>',
    grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'
  };
  function icon(name, label) {
    return '<svg class="i" viewBox="0 0 24 24" ' + (label ? 'role="img" aria-label="' + label + '"' : 'aria-hidden="true"') + '>' + (P[name] || P.todo) + '</svg>';
  }
  var STATE = {
    approved: { icon: 'check', t: 't-ok',   c: 'c-ok',   label: 'Approved by you', color: 'var(--ok)' },
    done:     { icon: 'check', t: 't-ok',   c: 'c-ok',   label: 'Done', color: 'var(--ok)' },
    auto:     { icon: 'bot',   t: 't-auto', c: 'c-auto', label: 'Auto-approved', color: 'var(--auto)' },
    review:   { icon: 'wait',  t: 't-wait', c: 'c-wait', label: 'Waiting for your review', color: 'var(--wait)' },
    active:   { icon: 'run',   t: 't-run',  c: 'c-run',  label: 'In progress', color: 'var(--run)' },
    todo:     { icon: 'todo',  t: 't-off',  c: '',       label: 'Not started', color: 'var(--off)' },
    skipped:  { icon: 'skip',  t: 't-off',  c: '',       label: 'Skipped', color: 'var(--off)' },
    blocked:  { icon: 'x',     t: 't-bad',  c: 'c-bad',  label: 'Blocked — needs you', color: 'var(--bad)' },
    reverted: { icon: 'undo',  t: 't-bad',  c: 'c-bad',  label: 'Reverted', color: 'var(--bad)' }
  };
  var APPROVER = { you: 'You', auto: 'Auto-approved by the approval mode', none: '' };
  var FINISHED = ['approved', 'auto', 'done', 'skipped'];
  function st(s) { return STATE[s] || STATE.todo; }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k]; if (v === undefined || v === null || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'svg') n.insertAdjacentHTML('afterbegin', v); // static icon markup only
      else if (k === 'class') n.className = v;
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function chip(text, cls, ic) { return el('span', { class: 'chip ' + (cls || ''), svg: ic ? icon(ic) : null }, [text]); }
  function stChip(s, text) { var x = st(s); return chip(text || x.label, x.c, x.icon); }
  function key(g) { return el('kbd', { class: 'gate', text: g }); }
  function real(v) { return v && v !== '—' && v !== 'none'; }
  function gateOf(s) { return real(s.gate) ? s.gate : ''; }
  function safeHref(h) { h = String(h || ''); return /^file:/i.test(h) || /^(?![a-z][a-z0-9+.-]*:)(?!\/\/)\S*$/i.test(h) ? h : '#'; }
  function when(iso) { var d = new Date(iso); return iso && !isNaN(d) ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : (iso || ''); }
  function ago(iso) {
    var d = new Date(iso); if (!iso || isNaN(d)) return '';
    var s = Math.round((Date.now() - d) / 1000), u = [[86400, 'd'], [3600, 'h'], [60, 'min']];
    for (var i = 0; i < u.length; i++) if (s >= u[i][0]) return Math.floor(s / u[i][0]) + ' ' + u[i][1] + ' ago';
    return 'just now';
  }
  function timeEl(iso) { return el('time', { datetime: iso, title: when(iso), text: ago(iso) }); }
  function who(by) { var m = /^(human|agent):(.*)$/.exec(by || ''); return m ? m[2] : (by || ''); }
  function isAgent(by) { return /^agent:/.test(by || ''); }
  function decState(d) { return d === 'approved' ? 'approved' : d === 'auto-approved' ? 'auto' : d === 'pending' ? 'review' : d === 'rejected' || d === 'reverted' ? 'reverted' : 'todo'; }

  var taskId = D.currentTask || (D.tasks[0] && D.tasks[0].id);
  function task() { return D.tasks.filter(function (t) { return t.id === taskId; })[0] || D.tasks[0]; }

  // ---------- hero ----------
  document.title = D.project + ' · SDD progress';
  document.getElementById('eyebrow').textContent = D.profile === 'app' ? 'Vibe coding → SDD' : 'SDD workflow';
  document.getElementById('title').textContent = D.project;
  var meta = document.getElementById('meta');
  if (D.mode) meta.appendChild(chip('Mode · ' + D.mode.name, 'c-accent', 'shield'));
  if (D.app && D.app.kind) meta.appendChild(chip('Kind · ' + D.app.kind));
  meta.appendChild(el('span', { class: 'chip mono', text: D.bundle + '/' }));
  meta.appendChild(el('span', { class: 'dim sm' }, ['Updated ', timeEl(D.generated), D.generatedBy ? ' by ' + who(D.generatedBy) : '']));
  function renderRing() {
    var steps = (D.app ? D.app.steps : []).concat(task().steps).filter(gateOf);
    var done = steps.filter(function (s) { return FINISHED.indexOf(s.state) >= 0; }).length, total = steps.length || 1;
    var c = 2 * Math.PI * 38, frac = done / total;
    var ring = document.getElementById('ring');
    ring.innerHTML = '<svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="var(--panel-2)" stroke-width="8"/>' +
      '<circle cx="46" cy="46" r="38" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (c * frac).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>';
    ring.appendChild(el('div', { class: 'val' }, [el('b', { text: done + '/' + steps.length }), el('span', { class: 'dim sm', text: 'gates' })]));
  }

  // ---------- tabs ----------
  function decisions() {
    var out = [];
    (D.app ? D.app.steps : []).forEach(function (s) { (s.decisions || []).forEach(function (d) { out.push({ d: d, scope: 'App', step: s }); }); });
    D.tasks.forEach(function (t) { t.steps.forEach(function (s) { (s.decisions || []).forEach(function (d) { out.push({ d: d, scope: t.title, step: s }); }); }); });
    (D.operations || []).forEach(function (o) { out.push({ op: o, d: { gate: o.id, decision: o.decision, by: o.by, at: o.at, artifact: o.action } }); });
    return out.filter(function (e) { return e.d.at; }).sort(function (a, b) { return String(b.d.at).localeCompare(String(a.d.at)); });
  }
  var TABS = [
    { id: 'overview', text: 'Overview', icon: 'compass' },
    { id: 'tasks', text: 'Tasks', icon: 'stack', n: D.app ? D.app.backlog.length || D.tasks.length : D.tasks.length },
    { id: 'log', text: 'Decision log', icon: 'pen', n: decisions().length },
    { id: 'ops', text: 'Operations', icon: 'term', n: (D.operations || []).length },
    { id: 'rules', text: 'Approval rules', icon: 'shield', hide: !D.matrix }
  ];
  var nav = document.getElementById('tabs');
  TABS.forEach(function (t) {
    if (t.hide) return;
    var b = el('button', { type: 'button', role: 'tab', 'data-tab': t.id, svg: icon(t.icon) }, [t.text]);
    if (t.n !== undefined) b.appendChild(el('span', { class: 'n', text: String(t.n) }));
    b.addEventListener('click', function () { go(t.id); });
    nav.appendChild(b);
  });
  function go(id) {
    if (!TABS.some(function (t) { return t.id === id && !t.hide; })) id = 'overview';
    document.querySelectorAll('main section').forEach(function (s) { s.hidden = s.getAttribute('data-tab') !== id; });
    nav.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === id)); });
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* not allowed for this URL (data: or sandboxed) */ }
  }

  // ---------- overview ----------
  function renderNow() {
    var box = document.getElementById('now'); box.innerHTML = '';
    var n = D.now || {}, waiting = n.waitingOnYou || [];
    box.className = 'card now' + (waiting.length ? ' waiting' : '');
    box.appendChild(el('div', { class: 'gutter', svg: icon(waiting.length ? 'wait' : 'flag') }));
    var b = el('div', { class: 'body', role: 'status' });
    b.appendChild(el('h2', { text: waiting.length ? 'Your review is needed' : 'Where things stand' }));
    b.appendChild(el('p', { text: n.text || '' }));
    waiting.forEach(function (w) {
      var btn = el('button', { class: 'btn', type: 'button', svg: icon('copy') }, ['Copy reply']);
      btn.addEventListener('click', function () {
        var ok = function () { btn.lastChild.textContent = 'Copied — paste it in the chat'; };
        if (navigator.clipboard) navigator.clipboard.writeText(w.reply).then(ok, function () { window.prompt('Copy this reply:', w.reply); });
        else window.prompt('Copy this reply:', w.reply);
      });
      b.appendChild(el('div', { class: 'ask' }, [key(w.gate), el('span', { style: 'flex:1 1 220px', text: w.what }),
        el('span', { class: 'mono dim', text: '“' + w.reply + '”' }), btn]));
    });
    if (n.last) {
      b.appendChild(el('p', { class: 'sm dim' }, ['Last decision ', key(n.last.gate), ' ', el('span', { class: st(decState(n.last.decision)).t, text: n.last.decision }),
        ' by ' + who(n.last.by) + ' · ' + [n.last.artifact, n.last.scope].filter(Boolean).join(' · ') + ' · ', timeEl(n.last.at)]));
    }
    if (!waiting.length) b.appendChild(el('p', { class: 'sm dim', text: 'Nothing is waiting for you. Operations — installs, accounts, deletes, publishing, deploys — are always asked in the chat.' }));
    box.appendChild(b);
  }

  function stopItem(s, isNow, prevFinished) {
    var x = st(s.state);
    var li = el('li', { class: 'stop s-' + s.state + (isNow ? ' is-now' : '') + (prevFinished && FINISHED.indexOf(s.state) >= 0 ? ' flow' : '') });
    li.appendChild(el('span', { class: 'node', svg: icon(x.icon, x.label) }));
    var head = el('button', { class: 'stop-head', type: 'button', 'aria-expanded': String(isNow) });
    var title = el('span', { class: 'stop-title' }, [el('span', { class: 'num', text: (s.n < 10 ? '0' : '') + s.n }), el('span', { class: 'name', text: s.name })]);
    if (gateOf(s)) title.appendChild(key(gateOf(s)));
    title.appendChild(el('span', { class: 'sub', text: s.short }));
    if (isNow) title.appendChild(el('span', { class: 'here', text: 'now' }));
    head.appendChild(title);
    head.appendChild(el('span', { class: 'stop-state' }, [el('span', { class: x.t, text: x.label + (s.progress ? ' · ' + s.progress.done + '/' + s.progress.total : '') }), el('span', { class: 'caret', svg: icon('caret') })]));
    li.appendChild(head);

    var body = el('div', { class: 'stop-body' });
    body.hidden = !isNow;
    if (s.explain) body.appendChild(el('p', { text: s.explain }));
    var kv = el('dl', { class: 'kv' });
    function row(k, v) { if (!v) return; kv.appendChild(el('dt', { text: k })); kv.appendChild(typeof v === 'string' ? el('dd', { text: v }) : el('dd', null, [v])); }
    row('Gate', gateOf(s) ? key(gateOf(s)) : 'None — the agent works and reports');
    row('Approves', s.approves);
    row('Approver', gateOf(s) ? APPROVER[s.approver] || s.approver : '');
    if (s.docs && s.docs.length) {
      var fs = el('span', { class: 'files' });
      s.docs.forEach(function (d) { fs.appendChild(el('a', { class: 'file', href: safeHref(d.href), title: d.href, svg: icon('file') }, [d.label])); });
      row('Files', fs);
    }
    body.appendChild(kv);
    if (s.progress) {
      var p = s.progress, pct = p.total ? Math.round(100 * p.done / p.total) : 0;
      var m = el('div', { class: 'meter' }, [el('span', { class: 'sm dim', text: p.done + ' of ' + p.total + ' ' + p.unit + ' done' }),
        el('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(p.total), 'aria-valuenow': String(p.done), 'aria-label': p.unit + ' done' }, [el('span', { style: 'width:' + pct + '%' })])]);
      body.appendChild(m);
      if (p.items && p.items.length) {
        var wi = el('div', { class: 'wi' });
        p.items.forEach(function (w) { wi.appendChild(stChip(w.state === 'doing' ? 'active' : w.state, w.id)); });
        body.appendChild(wi);
      }
    }
    var ds = s.decisions || [];
    if (ds.length) {
      var t = el('table'), th = el('thead'), tb = el('tbody');
      th.appendChild(el('tr', null, ['Gate', 'Decision', 'Artifact', 'By', 'When', 'Notes'].map(function (h) { return el('th', { text: h }); })));
      ds.forEach(function (d) {
        tb.appendChild(el('tr', null, [el('td', null, [key(d.gate)]), el('td', null, [stChip(decState(d.decision), d.decision)]),
          el('td', { class: 'mono', text: d.artifact || '' }), el('td', { text: who(d.by) + (isAgent(d.by) ? ' · agent' : '') }),
          el('td', null, [timeEl(d.at)]), el('td', { text: d.notes || '' })]));
      });
      t.appendChild(th); t.appendChild(tb);
      body.appendChild(el('div', { class: 'tbl' }, [t]));
    } else if (gateOf(s)) body.appendChild(el('p', { class: 'sm dim', text: 'No decision recorded yet.' }));
    li.appendChild(body);
    head.addEventListener('click', function () {
      var open = head.getAttribute('aria-expanded') !== 'true';
      head.setAttribute('aria-expanded', String(open)); body.hidden = !open;
    });
    return li;
  }
  function pipeline(cardId, titleKids, meta, steps, nowId) {
    var card = document.getElementById(cardId); card.innerHTML = ''; card.hidden = false;
    var gated = steps.filter(gateOf), passed = gated.filter(function (s) { return FINISHED.indexOf(s.state) >= 0; }).length;
    var toggle = el('button', { class: 'ghost', type: 'button', text: 'Expand all' });
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', null, titleKids), el('span', { class: 'sm dim', text: passed + '/' + gated.length + ' gates · ' + meta }), toggle]));
    var ol = el('ol', { class: 'pipe' });
    steps.forEach(function (s, i) { ol.appendChild(stopItem(s, s.id === nowId, i === 0 || FINISHED.indexOf(steps[i - 1].state) >= 0)); });
    card.appendChild(ol);
    toggle.addEventListener('click', function () {
      var open = toggle.textContent === 'Expand all';
      ol.querySelectorAll('.stop-head').forEach(function (h) { h.setAttribute('aria-expanded', String(open)); h.nextSibling.hidden = !open; });
      toggle.textContent = open ? 'Collapse all' : 'Expand all';
    });
  }
  function renderOverview() {
    renderNow();
    var n = D.now || {};
    if (D.app) pipeline('app-card', [el('span', { svg: icon('flag') }), 'App steps'], 'next: ' + D.app.next, D.app.steps, n.lane === 'app' ? n.step : null);
    var t = task();
    var kids = [el('span', { svg: icon('stack') }), t.title];
    if (real(t.type)) kids.push(chip(t.type)); if (real(t.track)) kids.push(chip(t.track + ' track')); if (real(t.feature)) kids.push(chip(t.feature, 'mono'));
    pipeline('task-card', kids, t.closed ? 'closed' : 'next: ' + t.next, t.steps, t.id === D.currentTask && n.lane === 'task' && !t.closed ? n.step : null);
    renderRing();
  }

  // ---------- tasks ----------
  function renderTasks() {
    var card = document.getElementById('tasks-card'); card.innerHTML = '';
    var open = D.tasks.filter(function (t) { return !t.closed && t.id; }).length, closed = D.tasks.filter(function (t) { return t.closed; }).length;
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', null, [el('span', { svg: icon('stack') }), D.app ? 'Backlog and tasks' : 'Tasks']),
      el('span', { class: 'sm dim', text: open + ' open · ' + closed + ' closed' + (D.app ? ' · one task per backlog item' : '') })]));
    var grid = el('div', { class: 'cards' });
    var rows = D.app && D.app.backlog.length ? D.app.backlog.map(function (b) { return { b: b, t: D.tasks.filter(function (t) { return t.id && t.id === b.task; })[0] }; })
      : D.tasks.map(function (t) { return { t: t }; });
    rows.forEach(function (r) {
      var t = r.t, b = r.b;
      var c = el(t ? 'button' : 'div', { class: 'tcard' + (t ? '' : ' idle') + (t && t.id === taskId ? ' sel' : ''), type: t ? 'button' : null });
      var top = el('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:start' }, [
        el('span', { class: 'tt', text: b ? b.id + ' · ' + b.item : t.title }),
        t ? stChip(t.closed ? 'done' : (t.steps.filter(function (s) { return ['review', 'blocked', 'reverted'].indexOf(s.state) >= 0; })[0] || { state: 'active' }).state, t.closed ? 'closed' : null)
          : chip(b.state === 'skipped' ? 'removed' : 'not opened')]);
      c.appendChild(top);
      if (t) {
        var chips = el('div', { class: 'meta' });
        if (real(t.type)) chips.appendChild(chip(t.type)); if (real(t.track)) chips.appendChild(chip(t.track)); if (real(t.feature)) chips.appendChild(chip(t.feature, 'mono'));
        c.appendChild(chips);
        var sb = el('div', { class: 'segbar', role: 'img', 'aria-label': t.steps.map(function (s) { return s.name + ': ' + st(s.state).label; }).join(', ') });
        t.steps.forEach(function (s) { sb.appendChild(el('i', { class: 's-' + s.state, title: s.name + ' — ' + st(s.state).label })); });
        c.appendChild(sb);
        c.appendChild(el('span', { class: 'mono dim', style: 'font-size:11.5px', text: (t.id || 'not opened yet') + (t.closed ? '' : ' · next: ' + t.next) }));
        c.addEventListener('click', function () { taskId = t.id; renderOverview(); renderSide(); renderTasks(); go('overview'); });
      } else c.appendChild(el('span', { class: 'sm dim', text: 'Opened when the build loop reaches it.' }));
      grid.appendChild(c);
    });
    card.appendChild(grid);
  }

  // ---------- decision log ----------
  function renderLog() {
    var card = document.getElementById('log-card'); card.innerHTML = '';
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', null, [el('span', { svg: icon('pen') }), 'Decision log']),
      el('span', { class: 'sm dim', text: 'Every approval, auto-approval, and operation — newest first' })]));
    var log = el('div', { class: 'log' }), lastDay = '';
    var es = decisions();
    if (!es.length) log.appendChild(el('p', { class: 'dim', text: 'No decisions recorded yet.' }));
    es.forEach(function (e) {
      var d = new Date(e.d.at), day = isNaN(d) ? e.d.at : d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
      if (day !== lastDay) { log.appendChild(el('div', { class: 'day', text: day })); lastDay = day; }
      var s = decState(e.d.decision);
      var what = el('div', { class: 'what' }, [key(e.d.gate), el('span', { class: st(s).t + ' ', style: 'font-weight:650', text: e.d.decision }),
        el('span', { class: 'dim', text: 'by' }), el('span', { text: who(e.d.by) }), isAgent(e.d.by) ? chip('agent', 'c-auto') : null]);
      var ctx = e.op ? el('div', { class: 'ctx' }, [el('span', { class: 'mono', text: e.op.action })])
        : el('div', { class: 'ctx sm dim' }, [e.scope + ' › ' + e.step.name + (e.d.artifact ? ' · ' : ''), e.d.artifact ? el('span', { class: 'mono', text: e.d.artifact }) : null]);
      var body = el('div', null, [what, ctx]);
      if (e.d.notes) body.appendChild(el('div', { class: 'sm dim', style: 'margin-top:2px', text: e.d.notes }));
      log.appendChild(el('div', { class: 'entry' }, [el('span', { class: 'clock', title: when(e.d.at), text: isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) }),
        el('span', { class: 'stripe s-' + s }), body]));
    });
    card.appendChild(log);
  }

  // ---------- operations ----------
  function renderOps() {
    var card = document.getElementById('ops-card'); card.innerHTML = '';
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', null, [el('span', { svg: icon('term') }), 'Operations']),
      el('span', { class: 'sm dim', text: 'Asked before each action, in every mode — never auto-approved' })]));
    var ops = D.operations || [];
    if (!ops.length) { card.appendChild(el('p', { class: 'dim', style: 'padding:0 18px 16px;margin:0', text: 'No operations recorded.' })); return; }
    var t = el('table'), th = el('thead'), tb = el('tbody');
    th.appendChild(el('tr', null, ['ID', 'Kind', 'Action', 'Decision', 'By', 'When'].map(function (h) { return el('th', { text: h }); })));
    ops.forEach(function (o) {
      tb.appendChild(el('tr', null, [el('td', null, [key(o.id)]), el('td', { text: o.category }), el('td', { class: 'mono', text: o.action }),
        el('td', null, [stChip(decState(o.decision), o.decision)]), el('td', { text: who(o.by) }), el('td', null, [timeEl(o.at)])]));
    });
    t.appendChild(th); t.appendChild(tb);
    card.appendChild(el('div', { style: 'padding:0 18px 18px' }, [el('div', { class: 'tbl' }, [t])]));
  }

  // ---------- approval rules ----------
  function renderRules() {
    var m = D.matrix, card = document.getElementById('rules-card'); card.innerHTML = '';
    if (!m) return;
    var cur = D.mode ? m.columns.indexOf(D.mode.name) : -1;
    card.appendChild(el('div', { class: 'card-head' }, [el('h2', null, [el('span', { svg: icon('shield') }), 'Who approves what']),
      el('span', { class: 'sm dim', text: D.mode ? 'Current mode highlighted · ' + D.mode.source : '' })]));
    var t = el('table'), th = el('thead'), tb = el('tbody');
    th.appendChild(el('tr', null, [el('th', { text: 'Gate' })].concat(m.columns.map(function (c, i) { return el('th', { class: i === cur ? 'cur' : '', text: c + (i === cur ? ' · current' : '') }); }))));
    m.rows.forEach(function (r) {
      tb.appendChild(el('tr', null, [el('td', { text: r[0] })].concat(r.slice(1).map(function (v, i) {
        return el('td', { class: i === cur ? 'cur' : '' }, [v === 'auto' ? stChip('auto', 'auto') : chip(v)]);
      }))));
    });
    t.appendChild(th); t.appendChild(tb);
    card.appendChild(el('div', { style: 'padding:0 18px 18px' }, [el('div', { class: 'tbl' }, [t])]));
  }

  // ---------- side panels ----------
  function renderSide() {
    var side = document.getElementById('side'); side.innerHTML = '';
    function panel(title, kids) { side.appendChild(el('div', { class: 'card' }, [el('h3', { text: title })].concat(kids))); }
    var waiting = (D.now && D.now.waitingOnYou) || [];
    panel('Waiting on you', [waiting.length ? el('ul', null, waiting.map(function (w) { return el('li', null, [key(w.gate), el('span', { class: 'sm', text: w.what })]); }))
      : el('span', { class: 'sm dim', text: 'Nothing right now.' })]);
    if (D.mode) {
      var rules = D.matrix ? el('button', { class: 'ghost', type: 'button', style: 'margin-top:8px;padding-left:0', text: 'Who approves what →' }) : null;
      if (rules) rules.addEventListener('click', function () { go('rules'); });
      panel('Approval mode', [chip(D.mode.name, 'c-accent', 'shield'), el('p', { class: 'sm dim', style: 'margin:8px 0 0', text: D.mode.label }), rules]);
    }
    var t = task(), docs = [{ label: 'status.md', href: t.status }];
    t.steps.forEach(function (s) { (s.docs || []).forEach(function (d) { docs.push(d); }); });
    if (D.app && D.app.status) docs.push({ label: 'app_status.md', href: D.app.status });
    docs = docs.filter(function (d, i) { return d.href && docs.findIndex(function (x) { return x.href === d.href; }) === i; });
    panel('Files · ' + t.title, [docs.length ? el('ul', null, docs.map(function (d) { return el('li', null, [el('span', { class: 'dim', svg: icon('file') }), el('a', { class: 'mono', href: safeHref(d.href), title: d.href, text: d.label })]); }))
      : el('span', { class: 'sm dim', text: 'No files yet.' })]);
    var lg = el('div', { class: 'legend' });
    Object.keys(STATE).forEach(function (k) { lg.appendChild(el('span', null, [el('i', { class: 'dot', style: 'background:' + st(k).color }), st(k).label])); });
    panel('Legend', [lg]);
  }

  document.getElementById('footer').textContent = 'Generated from the bundle records (status.md, app_status.md, backlog.md, operations.md, log.md). Do not edit this file — it is regenerated after every step; reload to see the latest.';
  renderOverview(); renderTasks(); renderLog(); renderOps(); renderRules(); renderSide();
  go((location.hash || '#overview').slice(1));
})();
</script>
</body>
